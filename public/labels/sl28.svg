<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1100" width="800" height="1100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Etiqueta Café de Especialidad · SL-28</title>
  <!-- Para imprimir: convierte los textos a contornos (Illustrator: Texto > Crear contornos / Inkscape: Trazado > Objeto a trazado) -->
  <defs>
    <linearGradient id="gMag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5FA8"/><stop offset="1" stop-color="#C2147A"/></linearGradient>
    <linearGradient id="gRose" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA3CB"/><stop offset="1" stop-color="#F0529A"/></linearGradient>
    <linearGradient id="gEm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D394"/><stop offset="1" stop-color="#087A59"/></linearGradient>
    <linearGradient id="gAqua" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8CF5E4"/><stop offset="1" stop-color="#17AFA8"/></linearGradient>
    <radialGradient id="gHalo" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#FF6FB1"/><stop offset="1" stop-color="#B3106F"/></radialGradient>

    <path id="leaf" d="M0,0 C-16,-12 -18,-38 0,-60 C18,-38 16,-12 0,0Z"/>

    <g id="lav">
      <path d="M0,0 C2,-40 -2,-90 0,-150" fill="none" stroke="#0E9F6E" stroke-width="3" stroke-linecap="round"/>
      <g fill="url(#gMag)">
        <ellipse cx="-7" cy="-62" rx="5" ry="11" transform="rotate(-25 -7 -62)"/><ellipse cx="7" cy="-70" rx="5" ry="11" transform="rotate(25 7 -70)"/>
        <ellipse cx="-7" cy="-82" rx="5" ry="11" transform="rotate(-25 -7 -82)"/><ellipse cx="7" cy="-90" rx="5" ry="11" transform="rotate(25 7 -90)"/>
        <ellipse cx="-7" cy="-102" rx="5" ry="11" transform="rotate(-25 -7 -102)"/><ellipse cx="7" cy="-110" rx="5" ry="11" transform="rotate(25 7 -110)"/>
        <ellipse cx="-6" cy="-122" rx="4.5" ry="10" transform="rotate(-25 -6 -122)"/><ellipse cx="6" cy="-130" rx="4.5" ry="10" transform="rotate(25 6 -130)"/>
      </g>
      <g fill="url(#gRose)">
        <ellipse cx="-5" cy="-141" rx="4" ry="9" transform="rotate(-20 -5 -141)"/><ellipse cx="5" cy="-146" rx="4" ry="9" transform="rotate(20 5 -146)"/>
        <ellipse cx="0" cy="-158" rx="4" ry="10"/>
      </g>
    </g>

    <g id="mint">
      <path d="M0,0 C4,-30 -2,-60 0,-95" fill="none" stroke="#087A59" stroke-width="3" stroke-linecap="round"/>
      <use xlink:href="#leaf" fill="url(#gEm)" transform="translate(0,-8) rotate(-55) scale(.9)"/>
      <use xlink:href="#leaf" fill="url(#gAqua)" transform="translate(0,-8) rotate(55) scale(.9)"/>
      <use xlink:href="#leaf" fill="url(#gEm)" transform="translate(1,-35) rotate(-45)"/>
      <use xlink:href="#leaf" fill="url(#gAqua)" transform="translate(1,-35) rotate(45)"/>
      <use xlink:href="#leaf" fill="url(#gEm)" transform="translate(0,-60) rotate(-30) scale(.85)"/>
      <use xlink:href="#leaf" fill="url(#gAqua)" transform="translate(0,-60) rotate(30) scale(.85)"/>
      <use xlink:href="#leaf" fill="url(#gEm)" transform="translate(0,-90) scale(.75)"/>
    </g>

    <g id="berries">
      <g fill="#128F96"><circle cx="0" cy="0" r="10"/><circle cx="19" cy="-8" r="9"/><circle cx="9" cy="16" r="8"/></g>
      <g fill="#F6EEDF" opacity=".55"><circle cx="-3" cy="-3" r="3"/><circle cx="16" cy="-11" r="2.6"/><circle cx="6" cy="13" r="2.3"/></g>
    </g>

    <g id="pep">
      <path d="M0,0 C20,-30 50,-40 85,-34" fill="none" stroke="#0E9F6E" stroke-width="2.5" stroke-linecap="round"/>
      <g fill="url(#gRose)">
        <circle cx="14" cy="-24" r="6"/><circle cx="30" cy="-36" r="5.5"/><circle cx="48" cy="-39" r="6"/><circle cx="66" cy="-38" r="5"/><circle cx="84" cy="-34" r="5.5"/>
        <circle cx="22" cy="-14" r="4.5"/><circle cx="56" cy="-26" r="4.5"/>
      </g>
      <g fill="#F6EEDF" opacity=".6"><circle cx="12" cy="-26" r="1.8"/><circle cx="28" cy="-38" r="1.6"/><circle cx="46" cy="-41" r="1.8"/></g>
    </g>

    <g id="agave">
      <path d="M0,0 C-26,-60 -20,-160 0,-230 C20,-160 26,-60 0,0Z" fill="url(#gEm)"/>
      <path d="M0,0 C-10,-70 -6,-160 0,-230" fill="none" stroke="#8CF5E4" stroke-width="2" opacity=".7"/>
      <path d="M0,0 C26,-60 20,-160 0,-230 C8,-150 6,-70 0,0Z" fill="#064D3B" opacity=".35"/>
    </g>

    <g id="cornerBottom">
      <use xlink:href="#lav" transform="translate(30,0) rotate(-8) scale(1.3)"/>
      <use xlink:href="#lav" transform="translate(70,0) rotate(14) scale(1.1)"/>
      <use xlink:href="#mint" transform="translate(10,0) rotate(-32) scale(1.15)"/>
      <use xlink:href="#mint" transform="translate(85,0) rotate(30) scale(.95)"/>
      <use xlink:href="#pep" transform="translate(25,-25) rotate(-25) scale(1.2)"/>
      <use xlink:href="#berries" transform="translate(88,-48)"/>
    </g>

    <g id="cornerTop">
      <use xlink:href="#lav" transform="translate(40,45) rotate(145) scale(1.2)"/>
      <use xlink:href="#lav" transform="translate(40,45) rotate(118) scale(.95)"/>
      <use xlink:href="#mint" transform="translate(40,45) rotate(165) scale(1.1)"/>
      <use xlink:href="#pep" transform="translate(40,45) rotate(100) scale(1.1)"/>
      <use xlink:href="#berries" transform="translate(98,78)"/>
    </g>
  </defs>

  <!-- CAPA 1: Fondo -->
  <g id="fondo">
    <rect width="800" height="1100" fill="#08261F"/>
    <circle cx="400" cy="570" r="392" fill="none" stroke="url(#gAqua)" stroke-width="4"/>
    <circle cx="400" cy="570" r="372" fill="url(#gHalo)"/>
    <rect x="20" y="20" width="760" height="1060" rx="26" fill="none" stroke="#3FD6C4" stroke-width="3"/>
    <rect x="32" y="32" width="736" height="1036" rx="18" fill="none" stroke="#FF5FA8" stroke-width="1.2" opacity=".8"/>
  </g>

  <!-- CAPA 2: Panel central -->
  <g id="panel">
    <path d="M130,900 V380 A270,270 0 0 1 670,380 V900 Z" fill="#F6EEDF"/>
    <path d="M148,882 V380 A252,252 0 0 1 652,380 V882 Z" fill="none" stroke="#D81B7A" stroke-width="2"/>
    <path d="M156,876 V380 A246,246 0 0 1 644,380 V876 Z" fill="none" stroke="#0E9F6E" stroke-width="1"/>
  </g>

  <!-- CAPA 3: Botánicos -->
  <g id="botanicos">
    <g id="agaves">
      <use xlink:href="#agave" transform="translate(400,1045) rotate(-62) scale(.62)"/>
      <use xlink:href="#agave" transform="translate(400,1045) rotate(62) scale(.62)"/>
      <use xlink:href="#agave" transform="translate(400,1045) rotate(-34) scale(.74)"/>
      <use xlink:href="#agave" transform="translate(400,1045) rotate(34) scale(.74)"/>
      <use xlink:href="#agave" transform="translate(400,1045) rotate(0) scale(.78)"/>
    </g>
    <use id="esquina-inf-izq" xlink:href="#cornerBottom" transform="translate(40,1030)"/>
    <use id="esquina-inf-der" xlink:href="#cornerBottom" transform="translate(760,1030) scale(-1,1)"/>
    <use id="esquina-sup-izq" xlink:href="#cornerTop"/>
    <use id="esquina-sup-der" xlink:href="#cornerTop" transform="translate(800,0) scale(-1,1)"/>
  </g>

  <!-- CAPA 4: Textos y marca -->
  <g id="textos" text-anchor="middle" fill="#08261F">
    <g id="logo-placeholder">
      <circle cx="400" cy="230" r="44" fill="none" stroke="#D81B7A" stroke-width="2" stroke-dasharray="5 4"/>
      <g transform="translate(400 230)" fill="none" stroke="#D81B7A" stroke-width="2.5" aria-label="Øpposite"><circle r="19"/><text x="0" y="13" text-anchor="middle" fill="#D81B7A" stroke="none" font-family="Georgia, serif" font-size="38" font-weight="700">O</text><path d="M-14 14 14 -14" stroke-linecap="round"/></g>
    </g>

    <g id="contenido-etiqueta" transform="translate(0 12)">
    <text x="400" y="288" font-family="'Montserrat','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="5" fill="#0E9F6E">MICROLOTE · EDICIÓN LIMITADA</text>

    <text id="variedad-label" x="400" y="326" font-family="'Montserrat','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="6" fill="#D81B7A">VARIEDAD</text>
    <text id="variedad" x="400" y="412" font-family="'Playfair Display',Georgia,'Times New Roman',serif" font-size="104" font-weight="700" fill="#08261F">SL-28</text>

    <g id="divisor-1">
      <line x1="270" y1="440" x2="380" y2="440" stroke="#0E9F6E" stroke-width="1.5"/>
      <rect x="395" y="435" width="10" height="10" fill="#D81B7A" transform="rotate(45 400 440)"/>
      <line x1="420" y1="440" x2="530" y2="440" stroke="#0E9F6E" stroke-width="1.5"/>
    </g>

    <text id="proceso-label" x="400" y="478" font-family="'Montserrat','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="6" fill="#D81B7A">PROCESO</text>
    <text id="proceso" font-family="'Playfair Display',Georgia,'Times New Roman',serif" font-size="21" font-weight="700" fill="#087A59">
      <tspan x="400" y="510">Lavado Avanzado con fermentación</tspan>
      <tspan x="400" y="538">en mosto de Variedad Gesha</tspan>
    </text>

    <g id="divisor-2">
      <line x1="270" y1="572" x2="380" y2="572" stroke="#0E9F6E" stroke-width="1.5"/>
      <rect x="395" y="567" width="10" height="10" fill="#D81B7A" transform="rotate(45 400 572)"/>
      <line x1="420" y1="572" x2="530" y2="572" stroke="#0E9F6E" stroke-width="1.5"/>
    </g>

    <text id="notas-label" x="400" y="606" font-family="'Montserrat','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="6" fill="#D81B7A">NOTAS DE CATA</text>
    <text id="notas" x="400" y="644" font-family="'Playfair Display',Georgia,'Times New Roman',serif" font-size="25" font-style="italic" fill="#08261F">Muy expresivo y floral.</text>

    <g id="divisor-3">
      <line x1="270" y1="676" x2="380" y2="676" stroke="#0E9F6E" stroke-width="1.5"/>
      <rect x="395" y="671" width="10" height="10" fill="#D81B7A" transform="rotate(45 400 676)"/>
      <line x1="420" y1="676" x2="530" y2="676" stroke="#0E9F6E" stroke-width="1.5"/>
    </g>

    <text id="productor-label" x="400" y="708" font-family="'Montserrat','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="6" fill="#D81B7A">PRODUCTOR</text>
    <text id="productor" x="400" y="737" font-family="'Playfair Display',Georgia,'Times New Roman',serif" font-size="23" font-weight="700" fill="#087A59">Marlon Bolaños</text>

    <text id="finca-label" x="400" y="772" font-family="'Montserrat','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="6" fill="#D81B7A">FINCA</text>
    <text id="finca" x="400" y="800" font-family="'Playfair Display',Georgia,'Times New Roman',serif" font-size="22" font-weight="700" fill="#08261F">The Three Coffee Farmers</text>

    <text id="altura" x="400" y="836" font-family="'Montserrat','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3.5" fill="#0E9F6E">SAN AGUSTÍN, HUILA · 1.700 MSNM</text>
    </g>
  </g>
</svg>
