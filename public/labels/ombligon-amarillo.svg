<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1100" width="800" height="1100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Etiqueta Café de Especialidad · Finca Nuevo Sol</title>
  <!-- Para imprimir: convierte los textos a contornos (Illustrator: Texto > Crear contornos / Inkscape: Trazado > Objeto a trazado) -->
  <defs>
    <linearGradient id="gSun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD84A"/><stop offset="1" stop-color="#F6A100"/></linearGradient>
    <linearGradient id="gLeaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3FB36F"/><stop offset="1" stop-color="#17402F"/></linearGradient>
    <linearGradient id="gPass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A24BBF"/><stop offset="1" stop-color="#5A1F72"/></linearGradient>

    <path id="leaf" d="M0,0 C-22,-25 -22,-70 0,-100 C22,-70 22,-25 0,0Z"/>

    <g id="hoja">
      <use xlink:href="#leaf" fill="url(#gLeaf)"/>
      <path d="M0,0 L0,-88" stroke="#FFF6E0" stroke-width="1.6" opacity=".6" fill="none"/>
      <path d="M0,-30 L-11,-45 M0,-30 L11,-45 M0,-55 L-9,-68 M0,-55 L9,-68" stroke="#FFF6E0" stroke-width="1.2" opacity=".5" fill="none"/>
    </g>

    <g id="flor">
      <g fill="#FFFFFF" stroke="#7A2E8E" stroke-width="1.5">
        <ellipse cx="0" cy="-30" rx="9" ry="26"/>
        <ellipse cx="0" cy="-30" rx="9" ry="26" transform="rotate(36)"/><ellipse cx="0" cy="-30" rx="9" ry="26" transform="rotate(72)"/>
        <ellipse cx="0" cy="-30" rx="9" ry="26" transform="rotate(108)"/><ellipse cx="0" cy="-30" rx="9" ry="26" transform="rotate(144)"/>
        <ellipse cx="0" cy="-30" rx="9" ry="26" transform="rotate(180)"/><ellipse cx="0" cy="-30" rx="9" ry="26" transform="rotate(216)"/>
        <ellipse cx="0" cy="-30" rx="9" ry="26" transform="rotate(252)"/><ellipse cx="0" cy="-30" rx="9" ry="26" transform="rotate(288)"/>
        <ellipse cx="0" cy="-30" rx="9" ry="26" transform="rotate(324)"/>
      </g>
      <circle r="22" fill="none" stroke="#8E3DB0" stroke-width="7" stroke-dasharray="1.5 2.5"/>
      <circle r="14" fill="#FFD23F"/>
      <circle r="5" fill="#2E8B57"/>
      <path d="M0,0 L-9,-9 M0,0 L9,-9 M0,0 L0,11" stroke="#2E8B57" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <g id="maracuya">
      <circle r="27" fill="url(#gPass)"/>
      <circle r="19" fill="#FFB300"/>
      <g fill="#5A1F72"><circle cx="-7" cy="-5" r="3"/><circle cx="6" cy="-8" r="3"/><circle cx="0" cy="3" r="3"/><circle cx="-9" cy="8" r="2.6"/><circle cx="9" cy="6" r="2.6"/></g>
    </g>

    <g id="esquinaInf">
      <use xlink:href="#hoja" transform="rotate(-28) scale(1.5)"/>
      <use xlink:href="#hoja" transform="rotate(8) scale(1.85)"/>
      <use xlink:href="#hoja" transform="rotate(42) scale(1.45)"/>
      <use xlink:href="#hoja" transform="rotate(74) scale(1.2)"/>
      <use xlink:href="#flor" transform="translate(40,-70) scale(1.15)"/>
      <use xlink:href="#maracuya" transform="translate(110,-18)"/>
      <use xlink:href="#flor" transform="translate(-10,-170) scale(.7)"/>
    </g>

    <g id="esquinaSup">
      <use xlink:href="#hoja" transform="rotate(138) scale(1.35)"/>
      <use xlink:href="#hoja" transform="rotate(112) scale(1.1)"/>
      <use xlink:href="#hoja" transform="rotate(160) scale(1)"/>
      <use xlink:href="#flor" transform="translate(88,98) scale(.9)"/>
    </g>
  </defs>

  <!-- CAPA 1: Fondo y rayos de sol -->
  <g id="fondo">
    <rect width="800" height="1100" fill="#FF8A1F"/>
    <path id="rayos" d="M400,250L1900.0,250.0L1887.2,445.8ZM400,250L1848.9,638.2L1785.8,824.0ZM400,250L1699.0,1000.0L1590.0,1163.1ZM400,250L1460.7,1310.7L1313.1,1440.0ZM400,250L1150.0,1549.0L974.0,1635.8ZM400,250L788.2,1698.9L595.8,1737.2ZM400,250L400.0,1750.0L204.2,1737.2ZM400,250L11.8,1698.9L-174.0,1635.8ZM400,250L-350.0,1549.0L-513.1,1440.0ZM400,250L-660.7,1310.7L-790.0,1163.1ZM400,250L-899.0,1000.0L-985.8,824.0ZM400,250L-1048.9,638.2L-1087.2,445.8ZM400,250L-1100.0,250.0L-1087.2,54.2ZM400,250L-1048.9,-138.2L-985.8,-324.0ZM400,250L-899.0,-500.0L-790.0,-663.1ZM400,250L-660.7,-810.7L-513.1,-940.0ZM400,250L-350.0,-1049.0L-174.0,-1135.8ZM400,250L11.8,-1198.9L204.2,-1237.2ZM400,250L400.0,-1250.0L595.8,-1237.2ZM400,250L788.2,-1198.9L974.0,-1135.8ZM400,250L1150.0,-1049.0L1313.1,-940.0ZM400,250L1460.7,-810.7L1590.0,-663.1ZM400,250L1699.0,-500.0L1785.8,-324.0ZM400,250L1848.9,-138.2L1887.2,54.2Z" fill="#FFA640"/>
    <rect x="24" y="24" width="752" height="1052" rx="22" fill="none" stroke="#FFF6E0" stroke-width="3"/>
    <rect x="36" y="36" width="728" height="1028" rx="14" fill="none" stroke="#FFF6E0" stroke-width="1" opacity=".7"/>
  </g>

  
  <!-- CAPA 2: Sol y panel central -->
  <g id="sol-panel">
    <circle cx="400" cy="250" r="146" fill="none" stroke="#FFF6E0" stroke-width="3"/>
    <circle cx="400" cy="250" r="128" fill="url(#gSun)"/>
    <rect id="panel" x="130" y="250" width="540" height="730" rx="28" fill="#FFF6E0"/>
    <rect x="146" y="266" width="508" height="698" rx="18" fill="none" stroke="#7A2E8E" stroke-width="2"/>
    <rect x="154" y="274" width="492" height="682" rx="12" fill="none" stroke="#F6B800" stroke-width="1"/>
  </g>

  <!-- CAPA 3: Botánicos -->
  <g id="botanicos">
    <use id="esquina-inf-izq" xlink:href="#esquinaInf" transform="translate(60,1040)"/>
    <use id="esquina-inf-der" xlink:href="#esquinaInf" transform="translate(740,1040) scale(-1,1)"/>
    <use id="esquina-sup-izq" xlink:href="#esquinaSup" transform="translate(30,30)"/>
    <use id="esquina-sup-der" xlink:href="#esquinaSup" transform="translate(770,30) scale(-1,1)"/>
  </g>

  <!-- CAPA 4: Textos y marca (misma jerarquía que SL-28) -->
  <g id="textos" text-anchor="middle" fill="#17402F">
    <g id="logo-placeholder"><circle cx="400" cy="190" r="44" fill="none" stroke="#17402F" stroke-width="2" stroke-dasharray="5 4"/><g transform="translate(400 190)" fill="none" stroke="#17402F" stroke-width="2.5" aria-label="Øpposite"><circle r="19"/><text x="0" y="13" text-anchor="middle" fill="#17402F" stroke="none" font-family="Georgia, serif" font-size="38" font-weight="700">O</text><path d="M-14 14 14 -14" stroke-linecap="round"/></g></g>
    <text id="tagline" x="400" y="314" font-family="'Montserrat','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="5" fill="#1F6B47">CAFÉ DE ESPECIALIDAD · COLOMBIA</text>
    <text id="variedad-label" x="400" y="352" font-family="'Montserrat','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="6" fill="#7A2E8E">VARIEDAD</text>
    <text id="variedad-1" x="400" y="438" font-family="'Playfair Display',Georgia,'Times New Roman',serif" font-size="68" font-weight="700" fill="#E06A00">OMBLIGÓN</text>
    <text id="variedad-2" x="400" y="504" font-family="'Playfair Display',Georgia,'Times New Roman',serif" font-size="68" font-weight="700" fill="#E06A00">AMARILLO</text>
    <g id="divisor-1"><line x1="270" y1="532" x2="380" y2="532" stroke="#F6B800" stroke-width="1.5"/><rect x="395" y="527" width="10" height="10" fill="#7A2E8E" transform="rotate(45 400 532)"/><line x1="420" y1="532" x2="530" y2="532" stroke="#F6B800" stroke-width="1.5"/></g>
    <text id="proceso-label" x="400" y="570" font-family="'Montserrat','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="6" fill="#7A2E8E">PROCESO</text>
    <text id="proceso" x="400" y="602" font-family="'Playfair Display',Georgia,'Times New Roman',serif" font-size="21" font-weight="700" opacity=".55" fill="#1F6B47"> Natural </text>
    <g id="divisor-2"><line x1="270" y1="632" x2="380" y2="632" stroke="#F6B800" stroke-width="1.5"/><rect x="395" y="627" width="10" height="10" fill="#7A2E8E" transform="rotate(45 400 632)"/><line x1="420" y1="632" x2="530" y2="632" stroke="#F6B800" stroke-width="1.5"/></g>
    <text id="notas-label" x="400" y="666" font-family="'Montserrat','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="6" fill="#7A2E8E">NOTAS</text>
    <text id="notas" x="400" y="704" font-family="'Playfair Display',Georgia,'Times New Roman',serif" font-size="25" font-style="italic" fill="#17402F">Muy frutal y vibrante.</text>
    <g id="divisor-3"><line x1="270" y1="736" x2="380" y2="736" stroke="#F6B800" stroke-width="1.5"/><rect x="395" y="731" width="10" height="10" fill="#7A2E8E" transform="rotate(45 400 736)"/><line x1="420" y1="736" x2="530" y2="736" stroke="#F6B800" stroke-width="1.5"/></g>
    <text id="productor-label" x="400" y="768" font-family="'Montserrat','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="6" fill="#7A2E8E">PRODUCTOR</text>
    <text id="productor" x="400" y="797" font-family="'Playfair Display',Georgia,'Times New Roman',serif" font-size="20" font-weight="700" fill="#1F6B47">Jhonatan Nieto &amp; Johanny González</text>
    <text id="finca-label" x="400" y="832" font-family="'Montserrat','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="6" fill="#7A2E8E">FINCA</text>
    <text id="finca" x="400" y="860" font-family="'Playfair Display',Georgia,'Times New Roman',serif" font-size="22" font-weight="700" fill="#17402F">Nuevo Sol</text>
    <text id="altura" x="400" y="896" font-family="'Montserrat','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3.5" fill="#1F6B47">PITALITO, HUILA · 1.600 MSNM</text>
    </g>
</svg>
